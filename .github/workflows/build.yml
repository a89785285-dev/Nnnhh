name: Extract ZIP Files

on:
  push:
    branches:
      - main
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP Files
        run: |
          shopt -s nullglob
          for file in *.zip; do
            tmp="$(mktemp -d)"
            unzip -o -q "$file" -d "$tmp"

            entries=("$tmp"/*)
            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
              src="${entries[0]}"
            else
              src="$tmp"
            fi

            # ملفات الـ workflows لا تُنسخ: GITHUB_TOKEN لا يقدر يكتبها
            rm -rf "$src/.github"

            cp -r "$src"/. .
            rm -rf "$tmp"
            echo "Extracted: $file"
          done

      - name: Commit Extracted Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Automatically extract ZIP files" || echo "Nothing to commit"
          git push
